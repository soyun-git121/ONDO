spring:
  profiles:
    active: dev

  jpa:
    open-in-view: false
    properties:
      hibernate:
        default_batch_fetch_size: 100

  servlet:
    multipart:
      max-file-size: 10MB          # api.md §8: 이미지 최대 10MB
      max-request-size: 10MB

ondo:
  jwt:
    # dev/local 편의를 위한 기본값. prod 프로파일이 이 값을 기본값 없이 덮어써서(아래 prod 블록),
    # 운영에서 JWT_SECRET 환경변수가 없으면 부팅이 실패한다 — 소스에 박힌 시크릿으로는 뜨지 않는다.
    secret: ${JWT_SECRET:dev-only-secret-key-change-me-in-production-1234567890}
    access-token-validity: 1800      # 30분 (초)
    refresh-token-validity: 1209600  # 14일 (초)
  upload:
    dir: ${UPLOAD_DIR:./uploads}     # 로컬 이미지 저장 디렉토리
  naver:
    client-id: ${NAVER_CLIENT_ID:}       # 네이버 검색(뉴스) API — backend/.env(gitignored)로 로컬 주입
    client-secret: ${NAVER_CLIENT_SECRET:}
  admin:
    # 관리자 계정 부트스트랩. 비어 있으면 계정을 만들지 않는다(운영 기본값).
    # 배포 시 ADMIN_PASSWORD를 1회 주입해 계정을 만든 뒤 환경변수에서 제거한다.
    bootstrap-username: ${ADMIN_USERNAME:admin}
    bootstrap-password: ${ADMIN_PASSWORD:}

---
# ===== dev: H2 인메모리 =====
spring:
  config:
    activate:
      on-profile: dev

  datasource:
    url: jdbc:h2:mem:ondo;MODE=MySQL;DATABASE_TO_LOWER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password:

  h2:
    console:
      enabled: true
      path: /h2-console

  flyway:
    enabled: false                   # dev는 엔티티 기준 create-drop + data.sql로 충분

  jpa:
    hibernate:
      ddl-auto: create-drop          # 엔티티 기준 테이블 자동 생성
    defer-datasource-initialization: true
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  sql:
    init:
      mode: always                   # data.sql 시드 실행

ondo:
  admin:
    bootstrap-password: ${ADMIN_PASSWORD:admin1234}   # 개발용 계정 (admin / admin1234)

logging:
  level:
    org.hibernate.orm.jdbc.bind: trace

---
# ===== local: Docker MySQL (루트 docker-compose.yml) =====
# 운영과 같은 MySQL·같은 Flyway 마이그레이션으로 돌려서 배포 전에 스키마를 검증한다.
# 실행: docker compose up -d  →  ./gradlew bootRun --args='--spring.profiles.active=local'
spring:
  config:
    activate:
      on-profile: local

  datasource:
    # 3307 = docker-compose.yml이 노출하는 포트 (호스트 MySQL 3306과 충돌 회피)
    url: ${DB_URL:jdbc:mysql://localhost:3307/ondo?serverTimezone=Asia/Seoul&characterEncoding=UTF-8}
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${DB_USERNAME:ondo}
    password: ${DB_PASSWORD:ondo_local_pw}

  jpa:
    hibernate:
      ddl-auto: validate             # 스키마는 Flyway가 만들고, JPA는 검증만
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  flyway:
    locations: classpath:db/migration,classpath:db/seed   # 스키마 + 로컬 시드

  sql:
    init:
      mode: never

ondo:
  admin:
    bootstrap-password: ${ADMIN_PASSWORD:admin1234}   # 개발용 계정 (admin / admin1234)

---
# ===== prod: MySQL =====
spring:
  config:
    activate:
      on-profile: prod

  datasource:
    url: ${DB_URL}
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: validate             # 운영은 스키마 검증만 (변경은 마이그레이션으로)

ondo:
  jwt:
    # 기본값 없음 — JWT_SECRET 환경변수가 없으면 기동 실패(placeholder 미해결).
    # 소스에 공개된 dev 기본값을 운영이 물려받아 관리자 토큰이 위조되는 것을 막는다.
    secret: ${JWT_SECRET}

  flyway:
    locations: classpath:db/migration                    # 시드 없이 스키마만

  sql:
    init:
      mode: never
