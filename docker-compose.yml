# 로컬 개발용 MySQL — 운영 배포는 관리형 DB(RDS/Cloud SQL 등)를 쓰고 이 파일은 쓰지 않는다.
# 기동:  docker compose up -d
# 접속:  docker compose exec mysql mysql -u ondo -p ondo
# 초기화: docker compose down -v   (볼륨까지 삭제 → 다음 기동 시 Flyway가 스키마 재생성)

services:
  mysql:
    image: mysql:8.4
    container_name: ondo-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-ondo_local_root}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-ondo}
      MYSQL_USER: ${MYSQL_USER:-ondo}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-ondo_local_pw}
      TZ: Asia/Seoul
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      - --default-time-zone=+09:00
    ports:
      # 호스트에 이미 설치된 MySQL(3306)과 충돌하지 않도록 3307로 노출한다.
      - "${MYSQL_PORT:-3307}:3306"
    volumes:
      - ondo-mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

volumes:
  ondo-mysql-data:
